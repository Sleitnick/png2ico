name: Build
on: [push]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux

          - host: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: win64

          - host: macos
            os: macos-26-intel
            target: x86_64-apple-darwin
            label: macos

          - host: macos
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      BIN: png2ico
    steps:
      - uses: actions/checkout@v4
      - name: Config
        run: cmake -S . -B out -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build out -j --config Debug
      - name: Test
        run: |
          cd test
          if [ "${{ matrix.host }}" = "windows" ]; then
            ../out/Debug/png2ico.exe test.ico icon_16.png icon_24.png icon_32.png icon_48.png icon_64.png icon_96.png icon_128.png icon_256.png
          else
            ../out/Debug/png2ico test.ico icon_16.png icon_24.png icon_32.png icon_48.png icon_64.png icon_96.png icon_128.png icon_256.png
          fi
